<!-- Add this to your dashboard header or as a separate section -->
<div class="metabase-link-section" style="background:#ffffff;border-radius:16px;padding:16px 24px;border:1px solid #eef2f6;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
    <div>
        <i class="fas fa-link" style="color:#2563eb;margin-right:8px;"></i>
        <span style="font-weight:500;">Metabase Integration:</span>
        <span style="color:#6b7a93;font-size:13px;">Connect your Metabase dashboard</span>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <input type="text" id="metabaseUrl" placeholder="Paste Metabase dashboard URL" style="padding:8px 12px;border:1px solid #d1d9e6;border-radius:8px;font-size:13px;min-width:300px;background:#fafbfc;" />
        <button onclick="loadMetabase()" style="padding:8px 20px;background:#2563eb;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:500;">
            <i class="fas fa-external-link-alt"></i> Load
        </button>
    </div>
</div>

<!-- Metabase iframe container -->
<div id="metabaseContainer" style="display:none;margin-bottom:24px;background:#ffffff;border-radius:16px;padding:20px;border:1px solid #eef2f6;">
    <div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;">
        <iframe id="metabaseIframe" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allow="fullscreen"></iframe>
    </div>
    <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
        <span style="font-size:13px;color:#6b7a93;"><i class="fas fa-info-circle"></i> Metabase dashboard embedded</span>
        <button onclick="document.getElementById('metabaseContainer').style.display='none'" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:13px;">
            <i class="fas fa-times"></i> Close
        </button>
    </div>
</div>

<script>
function loadMetabase() {
    const url = document.getElementById('metabaseUrl').value.trim();
    if (!url) {
        alert('Please paste a Metabase dashboard URL');
        return;
    }
    const container = document.getElementById('metabaseContainer');
    const iframe = document.getElementById('metabaseIframe');
    iframe.src = url;
    container.style.display = 'block';
    // Scroll to the iframe
    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
