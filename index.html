<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Re-edit Dashboard</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Sortable Table -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sortable/0.8.0/sortable.min.js"></script>
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f6f8fc;
            color: #1a1f36;
            padding: 24px;
        }
        .dashboard {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ---------- HEADER ---------- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-weight: 600;
            font-size: 28px;
            letter-spacing: -0.3px;
        }
        .header h1 i {
            color: #2563eb;
            margin-right: 10px;
        }
        .header .badge {
            background: #e0e7ff;
            color: #2563eb;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
        }

        /* ---------- CARDS ---------- */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #eef2f6;
            transition: transform 0.15s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        }
        .card .label {
            font-size: 13px;
            font-weight: 500;
            color: #5b677b;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .card .value {
            font-size: 32px;
            font-weight: 600;
            margin-top: 6px;
        }
        .card .sub {
            font-size: 13px;
            color: #5b677b;
            margin-top: 4px;
        }

        /* ---------- CHART GRID ---------- */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 28px;
        }
        .chart-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px 18px;
            border: 1px solid #eef2f6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .chart-card h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1a1f36;
        }
        .chart-card .chart-container {
            position: relative;
            height: 220px;
        }
        .chart-card.full-width {
            grid-column: 1 / -1;
        }
        .chart-card.full-width .chart-container {
            height: 200px;
        }

        /* ---------- TABLE ---------- */
        .table-wrapper {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #eef2f6;
            padding: 18px 16px 8px 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 20px;
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .table-header h3 {
            font-size: 15px;
            font-weight: 600;
        }
        .table-header input {
            padding: 8px 14px;
            border: 1px solid #d1d9e6;
            border-radius: 40px;
            font-size: 13px;
            width: 220px;
            background: #fafbfc;
        }
        .table-header input:focus {
            outline: none;
            border-color: #2563eb;
        }
        .table-scroll {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            background: #f8fafc;
            color: #2d3a4f;
            font-weight: 600;
            padding: 12px 8px;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }
        td {
            padding: 10px 8px;
            border-bottom: 1px solid #edf2f7;
            color: #1e293b;
            vertical-align: middle;
        }
        tr:hover td {
            background: #fafcff;
        }
        td a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            word-break: break-all;
        }
        td a:hover {
            text-decoration: underline;
        }
        .badge-action {
            background: #eef2ff;
            color: #4f46e5;
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            display: inline-block;
        }
        .text-muted {
            color: #6b7a93;
            font-size: 12px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 800px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .cards {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 480px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <!-- HEADER -->
    <div class="header">
        <h1><i class="fas fa-images"></i> Image Re-edit Dashboard</h1>
        <span class="badge"><i class="fas fa-database"></i> Last Month · <span id="rowCount">0</span> records</span>
    </div>

    <!-- CARDS -->
    <div class="cards" id="cards">
        <div class="card"><div class="label">Total Tasks</div><div class="value" id="totalTasks">0</div><div class="sub">entries</div></div>
        <div class="card"><div class="label">Unique Users</div><div class="value" id="uniqueUsers">0</div><div class="sub">contributors</div></div>
        <div class="card"><div class="label">Top Action</div><div class="value" id="topAction">—</div><div class="sub">most frequent</div></div>
        <div class="card"><div class="label">Image Actions</div><div class="value" id="actionCount">0</div><div class="sub">total</div></div>
    </div>

    <!-- CHARTS -->
    <div class="charts-grid">
        <!-- Donut: Action distribution -->
        <div class="chart-card">
            <h3><i class="fas fa-chart-pie" style="margin-right:8px;color:#2563eb;"></i>Task Distribution by Action</h3>
            <div class="chart-container"><canvas id="actionChart"></canvas></div>
        </div>
        <!-- Bar: User tasks -->
        <div class="chart-card">
            <h3><i class="fas fa-users" style="margin-right:8px;color:#2563eb;"></i>Tasks by User</h3>
            <div class="chart-container"><canvas id="userChart"></canvas></div>
        </div>
        <!-- Line: Timeline -->
        <div class="chart-card full-width">
            <h3><i class="fas fa-calendar-alt" style="margin-right:8px;color:#2563eb;"></i>Tasks by Date</h3>
            <div class="chart-container"><canvas id="timelineChart"></canvas></div>
        </div>
        <!-- Stacked bar: Action vs User -->
        <div class="chart-card full-width">
            <h3><i class="fas fa-layer-group" style="margin-right:8px;color:#2563eb;"></i>Action vs User (stacked)</h3>
            <div class="chart-container"><canvas id="stackedChart"></canvas></div>
        </div>
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
        <div class="table-header">
            <h3><i class="fas fa-list-ul" style="margin-right:8px;color:#2563eb;"></i>All Records</h3>
            <input type="text" id="searchInput" placeholder="🔍 Search by ID, user, action..." />
        </div>
        <div class="table-scroll">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Action</th>
                        <th>User</th>
                        <th>Created</th>
                        <th>Output Image</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- rows inserted by JS -->
                </tbody>
            </table>
        </div>
        <div style="padding:12px 0 4px 0;font-size:13px;color:#5b677b;">
            <span id="tableInfo">Showing 0 of 0</span>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- HELPER: parse CSV (simple) ----------
        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length === 0) return [];
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                // handles basic quoted fields
                let row = [];
                let current = '';
                let insideQuotes = false;
                const line = lines[i];
                for (let j = 0; j < line.length; j++) {
                    const ch = line[j];
                    if (ch === '"') {
                        insideQuotes = !insideQuotes;
                    } else if (ch === ',' && !insideQuotes) {
                        row.push(current.trim());
                        current = '';
                    } else {
                        current += ch;
                    }
                }
                row.push(current.trim());
                if (row.length < headers.length) continue;
                const obj = {};
                headers.forEach((h, idx) => {
                    let val = row[idx] || '';
                    // clean quotes
                    val = val.replace(/^"|"$/g, '');
                    obj[h] = val;
                });
                result.push(obj);
            }
            return result;
        }

        // ---------- LOAD CSV ----------
        const csvFile = 'Last_month.CSV.csv'; // adjust if needed

        fetch(csvFile)
            .then(res => {
                if (!res.ok) throw new Error('CSV not found');
                return res.text();
            })
            .then(text => {
                const data = parseCSV(text);
                if (data.length === 0) {
                    document.getElementById('rowCount').textContent = '0';
                    return;
                }
                renderDashboard(data);
            })
            .catch(err => {
                console.warn('Could not load CSV:', err);
                document.getElementById('rowCount').textContent = '⚠️';
                // Optionally show a message in the table
                document.getElementById('tableBody').innerHTML =
                    `<tr><td colspan="5" style="text-align:center;padding:40px;color:#6b7a93;">
                        <i class="fas fa-exclamation-triangle" style="font-size:20px;display:block;margin-bottom:8px;"></i>
                        Could not load CSV file. Make sure <strong>Last_month.CSV.csv</strong> is in the same folder.
                    </td></tr>`;
            });

        // ---------- RENDER DASHBOARD ----------
        function renderDashboard(data) {
            // Update row count
            document.getElementById('rowCount').textContent = data.length;

            // ----- CARDS -----
            const total = data.length;
            const users = [...new Set(data.map(r => r['User Details - Rejected By User__email_id'] || 'Unknown'))];
            const actionCounts = {};
            data.forEach(r => {
                const a = r['image_action'] || 'Unknown';
                actionCounts[a] = (actionCounts[a] || 0) + 1;
            });
            const topAction = Object.entries(actionCounts).sort((a, b) => b[1] - a[1])[0] || ['—', 0];

            document.getElementById('totalTasks').textContent = total;
            document.getElementById('uniqueUsers').textContent = users.length;
            document.getElementById('topAction').textContent = topAction[0];
            document.getElementById('actionCount').textContent = Object.keys(actionCounts).length;

            // ----- CHART: action distribution (donut) -----
            const actionLabels = Object.keys(actionCounts);
            const actionValues = Object.values(actionCounts);
            const colors = ['#4f46e5', '#7c3aed', '#2563eb', '#0ea5e9', '#06b6d4', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
            const bgColors = actionLabels.map((_, i) => colors[i % colors.length]);

            new Chart(document.getElementById('actionChart'), {
                type: 'doughnut',
                data: {
                    labels: actionLabels,
                    datasets: [{
                        data: actionValues,
                        backgroundColor: bgColors,
                        borderWidth: 0,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { boxWidth: 12, padding: 10, font: { size: 11 } } }
                    },
                    cutout: '65%'
                }
            });

            // ----- CHART: user tasks (horizontal bar) -----
            const userCounts = {};
            data.forEach(r => {
                const u = r['User Details - Rejected By User__email_id'] || 'Unknown';
                userCounts[u] = (userCounts[u] || 0) + 1;
            });
            const sortedUsers = Object.entries(userCounts).sort((a, b) => b[1] - a[1]);
            const userLabels = sortedUsers.map(u => u[0].split('@')[0] || u[0]);
            const userValues = sortedUsers.map(u => u[1]);

            new Chart(document.getElementById('userChart'), {
                type: 'bar',
                data: {
                    labels: userLabels,
                    datasets: [{
                        label: 'Tasks',
                        data: userValues,
                        backgroundColor: '#2563eb',
                        borderRadius: 4,
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { grid: { display: false }, beginAtZero: true },
                        y: { grid: { display: false } }
                    }
                }
            });

            // ----- CHART: timeline (line) -----
            const dateCounts = {};
            data.forEach(r => {
                const d = r['created_on'] || '';
                // parse "5 Aug, 2026, 18:41" -> "Aug 5"
                const parts = d.split(',');
                if (parts.length >= 2) {
                    const dayMonth = parts[0].trim(); // "5 Aug"
                    const monthDay = dayMonth.split(' ').reverse().join(' '); // "Aug 5"
                    dateCounts[monthDay] = (dateCounts[monthDay] || 0) + 1;
                }
            });
            const sortedDates = Object.keys(dateCounts).sort((a, b) => {
                const da = new Date(a + ', 2026');
                const db = new Date(b + ', 2026');
                return da - db;
            });
            const timelineData = sortedDates.map(d => dateCounts[d]);

            new Chart(document.getElementById('timelineChart'), {
                type: 'line',
                data: {
                    labels: sortedDates,
                    datasets: [{
                        label: 'Tasks',
                        data: timelineData,
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.08)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 3,
                        pointBackgroundColor: '#2563eb',
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxRotation: 30, font: { size: 10 } } },
                        y: { beginAtZero: true, grid: { color: '#f0f2f5' } }
                    }
                }
            });

            // ----- CHART: stacked bar (action vs user) -----
            const topUsers = sortedUsers.slice(0, 10).map(u => u[0]);
            const actions = Object.keys(actionCounts);
            const stackedData = actions.map(action => {
                return {
                    label: action,
                    data: topUsers.map(user => {
                        return data.filter(r =>
                            (r['image_action'] || 'Unknown') === action &&
                            (r['User Details - Rejected By User__email_id'] || 'Unknown') === user
                        ).length;
                    }),
                    backgroundColor: colors[actions.indexOf(action) % colors.length],
                };
            });

            new Chart(document.getElementById('stackedChart'), {
                type: 'bar',
                data: {
                    labels: topUsers.map(u => u.split('@')[0] || u),
                    datasets: stackedData,
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top', labels: { boxWidth: 12, font: { size: 10 } } }
                    },
                    scales: {
                        x: { stacked: true, grid: { display: false } },
                        y: { stacked: true, beginAtZero: true, grid: { color: '#f0f2f5' } }
                    }
                }
            });

            // ----- TABLE -----
            renderTable(data);

            // Search filter
            document.getElementById('searchInput').addEventListener('input', function(e) {
                const term = e.target.value.toLowerCase();
                const rows = document.querySelectorAll('#tableBody tr');
                let visible = 0;
                rows.forEach(row => {
                    const text = row.textContent.toLowerCase();
                    if (text.includes(term)) {
                        row.style.display = '';
                        visible++;
                    } else {
                        row.style.display = 'none';
                    }
                });
                document.getElementById('tableInfo').textContent = `Showing ${visible} of ${data.length}`;
            });
        }

        // ---------- RENDER TABLE ----------
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach((row, idx) => {
                const id = row['id'] || row['Id'] || idx + 1;
                const action = row['image_action'] || '—';
                const user = row['User Details - Rejected By User__email_id'] || '—';
                const created = row['created_on'] || '—';
                const output = row['output_image_hres_url'] || row['manual_edited_hres_url'] || '';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><code style="background:#f1f4f9;padding:2px 6px;border-radius:4px;font-size:12px;">${id}</code></td>
                    <td><span class="badge-action">${action}</span></td>
                    <td>${user}</td>
                    <td class="text-muted">${created}</td>
                    <td>${output ? `<a href="${output}" target="_blank"><i class="fas fa-external-link-alt"></i> View</a>` : '—'}</td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('tableInfo').textContent = `Showing ${data.length} of ${data.length}`;
        }

    })();
</script>
</body>
</html>
